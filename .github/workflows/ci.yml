# Tests every push and pull request; a push to master that passes is built
# and published to GitHub Pages.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# One run per branch at a time. A newer push to a pull request cancels the
# run it replaces; on master it waits instead, so a deploy is never cut off
# halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pinned rather than ubuntu-latest: Playwright ships browser builds per
  # Ubuntu release, so move to a newer image once Playwright supports it.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browsers are cached per Playwright version and browser list. The
      # install skips any browser the cache already holds, and installs the
      # system libraries, which cannot be cached, either way.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
